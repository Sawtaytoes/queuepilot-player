plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jlleitschuh.gradle.ktlint'
}
android {
    namespace 'dev.queuepilot.player'
    compileSdk 36
    defaultConfig { applicationId 'dev.queuepilot.player.prototype'; minSdk 30; targetSdk 36; versionCode 18; versionName '0.6.3-preview' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true }
    sourceSets.main.jniLibs.srcDirs = ['build/native-libs']
    sourceSets.main.assets.srcDirs += ['build/native-assets']
    lint { abortOnError true }
    buildTypes {
        // The build the TVs get. R8 removes unused code and resources and shortens names, and
        // the build is not debuggable, so Android compiles it ahead of time. It is signed with
        // the key in ~/.android/debug.keystore that has signed every TV install so far, so it
        // installs over a debug build and keeps the app's data. Debug builds stay for
        // development and the emulator checks that read the app's files.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
}
kotlin {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}
ktlint {
    version.set('1.8.0')
    android.set(true)
}
dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    // Compose for TV. The bill of materials keeps every Compose library at versions that were
    // released and tested together; tv-material is versioned on its own. 2026.06.01 (Compose
    // 1.11) is the newest that builds with Android Gradle plugin 8.13 and compileSdk 36;
    // Compose 1.12 needs plugin 9.1 and compileSdk 37.
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.tv:tv-material:1.1.0'
    // Compose rules for ktlint: the mainstream checks for composable naming, modifiers and state.
    ktlintRuleset 'io.nlopez.compose.rules:ktlint:0.6.8'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local unit tests; this is the reference implementation.
    testImplementation 'org.json:json:20240303'
}
